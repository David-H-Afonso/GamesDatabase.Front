<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
		<link rel="icon" type="image/x-icon" href="/favicon.ico" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.json" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Games Database" />
		<meta name="theme-color" content="#1a1a1a" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Games Database</title>
		<meta name="description" content="Games Database – track, manage, and explore your personal game collection with statuses, ratings, platforms, and more." />
		<!-- Load runtime environment configuration (for Docker) -->
		<!-- defer keeps it out of the critical render path; type="module" (main.tsx) is
		     also deferred so document order is preserved and ENV is always set first -->
		<script defer src="/env-config.js"></script>
		<!-- Apply theme IMMEDIATELY before any rendering to prevent FOUC -->
		<script>
			;(function () {
				var saved = null
				try { saved = localStorage.getItem('theme') } catch (_) { /* Appearance still works without storage. */ }
				var aliases = { original: 'gallery', wolverine: 'wolverine-classic', gta: 'gta-vice-city' }
				saved = aliases[saved] || saved
				var known = ['gallery','light','dark','steam','wolverine-classic','wolverine-modern','gta-vice-city','gta-iv','gta-v','gta-vi','nintendo','playstation','xbox']
				var theme = known.indexOf(saved) >= 0 ? saved : 'gallery'
				document.documentElement.setAttribute('data-theme', theme)
				document.documentElement.setAttribute('data-experience', 'gallery')
				// Add a class to prevent transitions on initial load
				document.documentElement.classList.add('preload')
			})()
		</script>
		<link rel="preload" as="font" type="font/woff2" href="/src/assets/fonts/dm-sans.woff2" crossorigin />
		<link rel="preload" as="font" type="font/woff2" href="/src/assets/fonts/outfit.woff2" crossorigin />
	</head>
	<body>
		<div id="root"></div>
		<div id="dropdown-portal"></div>
		<div id="modal-portal"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
