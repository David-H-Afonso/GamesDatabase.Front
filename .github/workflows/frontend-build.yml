name: Frontend Validation

on:
  pull_request:
    branches: [master]
  workflow_call:
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}
      already_published:
        value: ${{ jobs.build.outputs.already_published }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      already_published: ${{ steps.version.outputs.already_published }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Test versioning and native dependency guards
        run: node --test scripts/versioning/core.test.mjs scripts/ci/native-lock.test.mjs
      - name: Validate every outgoing commit version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/versioning/cli.mjs check-range --from "$BASE_SHA" --to "$HEAD_SHA"
      - name: Verify the lock contains every native platform target
        run: node scripts/ci/native-lock.mjs
      - name: Install dependencies
        run: npm ci --include=optional
      - name: Exercise installed Rollup, esbuild and embedded Sass
        run: node scripts/ci/native-lock.mjs --installed
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Committed artifact version
        id: version
        run: node scripts/versioning/cli.mjs release-info | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const v=JSON.parse(s);console.log('version='+v.version);console.log('already_published='+v.alreadyPublished)})" >> "$GITHUB_OUTPUT"
